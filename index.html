<!DOCTYPE html>
<html>
<head>
    <title>mudboy</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }

        .corner-link {
            position: fixed;
            font-size: 24px;
            color: #000;
            text-decoration: none;
            padding: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .corner-link::before {
            content: '> ';
        }

        .corner-link::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }

        .corner-link:hover {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
        }

        .top-left {
            top: 0;
            left: 0;
        }

        .top-right {
            top: 0;
            right: 0;
        }

        .bottom-left {
            bottom: 0;
            left: 0;
        }

        .bottom-right {
            bottom: 0;
            right: 0;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.9; }
            10% { opacity: 0.97; }
            15% { opacity: 0.92; }
            20% { opacity: 0.97; }
            50% { opacity: 0.95; }
            80% { opacity: 0.97; }
            90% { opacity: 0.9; }
            100% { opacity: 0.97; }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.03),
                rgba(0, 0, 0, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            animation: flicker 0.15s infinite;
            z-index: 1000;
        }

        .scanlines::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            animation: scanline 8s linear infinite;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <a href="https://github.com/kunalb360" class="corner-link top-left">github</a>
    <a href="https://linkedin.com/in/kunalbhatt360" class="corner-link top-right">linkedin</a>
    <a href="reading-list.html" class="corner-link bottom-left">reading list</a>
    <a href="#" class="corner-link bottom-right">substack</a>

    <img src="resources/mudboy_motif.png" alt="mudboy motif">
</body>
</html>
