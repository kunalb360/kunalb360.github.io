<!DOCTYPE html>
<html>
<head>
    <title>mudboy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            overflow: hidden;
        }

        img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }

        .self-link {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 24px;
            color: #000;
            text-decoration: none;
            white-space: nowrap;
        }

        /* lay out as "the self" (same as index.html) so "self" lands in the
           exact same spot; "the higher" is right-aligned to the hidden "the"
           and extends to the left */
        .lead {
            position: relative;
        }

        .lead .ghost {
            visibility: hidden;
        }

        .lead .real {
            position: absolute;
            top: 0;
            right: 0;
            white-space: nowrap;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.9; }
            10% { opacity: 0.97; }
            15% { opacity: 0.92; }
            20% { opacity: 0.97; }
            50% { opacity: 0.95; }
            80% { opacity: 0.97; }
            90% { opacity: 0.9; }
            100% { opacity: 0.97; }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.03),
                rgba(0, 0, 0, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            animation: flicker 0.15s infinite;
            z-index: 1000;
        }

        .scanlines::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            animation: scanline 8s linear infinite;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <a href="the-self.html" class="self-link"><span class="lead"><span class="ghost">the</span><span class="real">the higher</span></span> self</a>

    <img src="resources/mudboy_motif.png" alt="mudboy motif">
</body>
</html>
